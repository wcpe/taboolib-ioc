name: Snapshot Build

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    name: Build & Publish SNAPSHOT
    runs-on: ubuntu-latest

    steps:
      # ── 1. 检出完整历史 ──────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── 2. 解析构建元信息 ────────────────────────────────────────────────
      - name: Resolve build info
        id: info
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          DATE=$(date -u +"%Y%m%d")
          # 从 gradle.properties 读取基础版本，去掉 -SNAPSHOT 后缀
          BASE_VERSION=$(grep '^version=' gradle.properties | cut -d= -f2 | sed 's/-SNAPSHOT//')
          SNAP_VERSION="${BASE_VERSION}-SNAPSHOT+${DATE}.${SHORT_SHA}"
          echo "snap_version=${SNAP_VERSION}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}"       >> "$GITHUB_OUTPUT"
          echo "date=${DATE}"                 >> "$GITHUB_OUTPUT"
          echo "Snapshot version: ${SNAP_VERSION}"

      # ── 3. 写入版本号 ────────────────────────────────────────────────────
      - name: Set version in gradle.properties
        run: |
          sed -i "s/^version=.*/version=${{ steps.info.outputs.snap_version }}/" gradle.properties

      # ── 4. 配置 JDK ─────────────────────────────────────────────────────
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      # ── 5. 配置 Gradle（含 wrapper 校验 + 缓存）─────────────────────────
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # 校验 gradle-wrapper.jar 的 checksum，防止分发被篡改
          validate-wrappers: true

      # ── 5.5. 修复 Linux 下 gradlew 执行权限 ─────────────────────────────
      - name: Make gradlew executable
        run: chmod +x gradlew

      # ── 6. 构建产物（测试由独立 test workflow 把关，此处只出产物）────────
      - name: Build artifacts
        run: ./gradlew build -x test --no-daemon

      # ── 7. 收集产物（含 jar 内容校验）────────────────────────────────────
      - name: Collect artifacts
        id: artifacts
        run: |
          set -euo pipefail
          # 库产物：api / core / annotation 承载全部实现类；
          # taboolib-ioc 是聚合门面（subproject=true，仅 MANIFEST + api 依赖，无 class），
          # 已在下方按「含 .class 条目」校验后自动排除，避免发布空壳 jar。
          # 过滤项只保留 `-sources`（withSourcesJar() 真实生效）；`-test-fixtures` / `plain`
          # 全仓零配置，属死过滤，已删除。
          CANDIDATES=$(ls \
            taboolib-ioc/build/libs/*.jar \
            taboolib-ioc-api/build/libs/*.jar \
            taboolib-ioc-core/build/libs/*.jar \
            taboolib-ioc-annotation/build/libs/*.jar 2>/dev/null \
            | grep -v -E '\-sources\.' || true)

          if [ -z "${CANDIDATES// /$'\n'}" ]; then
            echo "::error::未找到任何库产物 jar，构建目录异常"
            exit 1
          fi

          ARTIFACTS=""
          EXCLUDED=""
          for jar in ${CANDIDATES}; do
            class_count=$(unzip -l "${jar}" | grep -c '\.class$' || true)
            if [ "${class_count}" -eq 0 ]; then
              echo "::warning::跳过空壳 jar（0 个 class 条目）：${jar}"
              EXCLUDED="${EXCLUDED} ${jar}"
              continue
            fi
            echo "OK (${class_count} classes): ${jar}"
            ARTIFACTS="${ARTIFACTS} ${jar}"
          done

          ARTIFACTS="${ARTIFACTS# }"
          if [ -z "${ARTIFACTS// /}" ]; then
            echo "::error::全部候选 jar 都不含 class 条目，构建目录异常"
            exit 1
          fi
          echo "artifacts=${ARTIFACTS}" >> "$GITHUB_OUTPUT"
          echo "excluded=${EXCLUDED# }" >> "$GITHUB_OUTPUT"
          echo "Found artifacts: ${ARTIFACTS}"
          echo "Excluded empty jars: ${EXCLUDED# }"

      # ── 8. 生成更新日志（最近 20 条提交）────────────────────────────────
      - name: Generate changelog
        run: |
          PREV_TAG=$(git tag --sort=-version:refname | head -n 1)
          if [ -z "${PREV_TAG}" ]; then
            RANGE="HEAD"
            SINCE_DESC="（自初始提交以来）"
          else
            RANGE="${PREV_TAG}..HEAD"
            SINCE_DESC="（自 \`${PREV_TAG}\` 以来）"
          fi

          COMMITS=$(git log ${RANGE} --pretty=format:"- %s (%h)" -- | head -n 20 || true)
          EXTRA=$(git log ${RANGE} --oneline -- | wc -l | tr -d ' ')

          {
            echo "## ⚠️ 这是自动构建的 SNAPSHOT 版本，非正式发布"
            echo ""
            echo "> 构建时间：\`$(date -u '+%Y-%m-%d %H:%M:%S UTC')\`"
            echo "> Commit：[\`${{ steps.info.outputs.short_sha }}\`](https://github.com/${{ github.repository }}/commit/${{ github.sha }})"
            echo "> 版本号：\`${{ steps.info.outputs.snap_version }}\`"
            echo ""
            echo "## 最近提交 ${SINCE_DESC}"
            echo ""
            if [ -n "${COMMITS}" ]; then
              echo "${COMMITS}"
              [ "${EXTRA}" -gt 20 ] && echo "" && echo "_…及更多 $(( EXTRA - 20 )) 条提交_"
            else
              echo "_（无新提交）_"
            fi
            echo ""
            echo "## 产物说明"
            echo ""
            echo "- 本 SNAPSHOT 中的 jar 已逐个做内容校验，保证均含 class 条目。"
            echo "- 实现类分布在 \`taboolib-ioc-core\` / \`taboolib-ioc-api\` / \`taboolib-ioc-annotation\`；"
            echo "  \`taboolib-ioc\` 是聚合门面（0 个 class），不作为独立 jar 发布。"
          } > SNAPSHOT_BODY.md

          cat SNAPSHOT_BODY.md

      # ── 9. 覆盖发布同一个 SNAPSHOT Release ─────────────────────────────
      - name: Publish SNAPSHOT Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: SNAPSHOT
          name: "SNAPSHOT — ${{ steps.info.outputs.snap_version }}"
          body_path: SNAPSHOT_BODY.md
          draft: false
          prerelease: true
          # 覆盖旧产物：删掉同名文件后重新上传
          files: ${{ steps.artifacts.outputs.artifacts }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
