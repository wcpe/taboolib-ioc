name: Build & Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "发布标签（如 v1.2.0）"
        required: true

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      # ── 1. 检出完整历史（用于更新日志对比）──────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── 2. 解析版本号 ────────────────────────────────────────────────────
      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          # 去掉前缀 v，得到纯版本号（如 1.2.0）
          VERSION="${TAG#v}"
          echo "tag=${TAG}"       >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved: tag=${TAG}, version=${VERSION}"

      # ── 3. 写入构建版本号，覆盖 SNAPSHOT ────────────────────────────────
      - name: Set version in gradle.properties
        run: |
          sed -i "s/^version=.*/version=${{ steps.version.outputs.version }}/" gradle.properties
          cat gradle.properties

      # ── 4. 配置 JDK ─────────────────────────────────────────────────────
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      # ── 5. 配置 Gradle（含缓存）─────────────────────────────────────────
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # ── 5.5. 修复 Linux 下 gradlew 执行权限 ─────────────────────────────
      - name: Make gradlew executable
        run: chmod +x gradlew

      # ── 6. 构建 ──────────────────────────────────────────────────────────
      - name: Build
        run: ./gradlew build -x test --no-daemon

      # ── 7. 收集产物 ──────────────────────────────────────────────────────
      - name: Collect artifacts
        id: artifacts
        run: |
          # 主插件 JAR（排除 -sources 等附属产物）
          MAIN_JAR=$(ls build/libs/*.jar | grep -v '\-sources\.\|plain\.' | head -n 1)
          echo "main_jar=${MAIN_JAR}" >> "$GITHUB_OUTPUT"
          echo "Found artifact: ${MAIN_JAR}"

      # ── 8. 生成更新日志 ──────────────────────────────────────────────────
      - name: Generate changelog
        id: changelog
        run: |
          # 找出上一个 tag（无则从初始提交起）
          PREV_TAG=$(git tag --sort=-version:refname | grep -v "^${{ steps.version.outputs.tag }}$" | head -n 1)
          if [ -z "${PREV_TAG}" ]; then
            RANGE="HEAD"
            echo "No previous tag found, listing all commits"
          else
            RANGE="${PREV_TAG}..HEAD"
            echo "Changelog range: ${PREV_TAG} -> HEAD"
          fi

          # 按类型收集提交（feat / fix / refactor / docs / chore / 其他）
          FEAT=$(git log ${RANGE} --pretty=format:"- %s (%h)" -- | grep -iE "^- feat" || true)
          FIX=$(git log ${RANGE} --pretty=format:"- %s (%h)" -- | grep -iE "^- fix" || true)
          REFACTOR=$(git log ${RANGE} --pretty=format:"- %s (%h)" -- | grep -iE "^- refactor" || true)
          DOCS=$(git log ${RANGE} --pretty=format:"- %s (%h)" -- | grep -iE "^- docs" || true)
          CHORE=$(git log ${RANGE} --pretty=format:"- %s (%h)" -- | grep -iE "^- chore|^- build|^- ci" || true)
          OTHER=$(git log ${RANGE} --pretty=format:"- %s (%h)" -- | grep -ivE "^- feat|^- fix|^- refactor|^- docs|^- chore|^- build|^- ci" || true)

          {
            echo "## 更新内容"
            echo ""
            [ -n "${FEAT}" ]     && echo "### ✨ 新功能"     && echo "${FEAT}"     && echo ""
            [ -n "${FIX}" ]      && echo "### 🐛 问题修复"   && echo "${FIX}"      && echo ""
            [ -n "${REFACTOR}" ] && echo "### ♻️ 重构"        && echo "${REFACTOR}" && echo ""
            [ -n "${DOCS}" ]     && echo "### 📝 文档"        && echo "${DOCS}"     && echo ""
            [ -n "${CHORE}" ]    && echo "### 🔧 构建 / CI"  && echo "${CHORE}"    && echo ""
            [ -n "${OTHER}" ]    && echo "### 其他"           && echo "${OTHER}"    && echo ""
            [ -n "${PREV_TAG}" ] && echo "**完整变更**：[\`${PREV_TAG}\` → \`${{ steps.version.outputs.tag }}\`](https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${{ steps.version.outputs.tag }})"
          } > CHANGELOG_BODY.md

          cat CHANGELOG_BODY.md

      # ── 9. 发布 Release ──────────────────────────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "AllinTreasureHunt ${{ steps.version.outputs.tag }}"
          body_path: CHANGELOG_BODY.md
          draft: false
          prerelease: ${{ contains(steps.version.outputs.tag, '-') }}
          files: ${{ steps.artifacts.outputs.main_jar }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
