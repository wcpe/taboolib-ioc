name: Tests

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  test:
    name: Run all tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      # 运行全量测试，失败也继续其它模块
      - name: Run tests
        run: ./gradlew test --continue --no-daemon

      # 聚合 JUnit XML，写入 Step Summary 与 markdown
      - name: Generate test report
        if: always()
        run: python3 .github/scripts/aggregate-test-results.py

      - name: Upload JUnit XML results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-results
          path: "**/build/test-results/test/TEST-*.xml"
          if-no-files-found: warn

      - name: Upload HTML reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-html-reports
          path: "**/build/reports/tests/test/**"
          if-no-files-found: warn

      - name: Upload markdown report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-md
          path: test-report.md
          if-no-files-found: warn

      # 在 Checks 页签显示结构化测试结果
      - name: Publish test results to Checks
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: "**/build/test-results/test/TEST-*.xml"
          check_name: "Test Results"
          comment_mode: off
