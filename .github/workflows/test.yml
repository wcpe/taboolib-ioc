name: Tests

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  test:
    name: Run all tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      # 运行全量测试，失败也继续其它模块
      - name: Run tests
        run: ./gradlew test --continue --no-daemon

      # 聚合 JUnit XML，写入 Step Summary 与 markdown
      - name: Generate test report
        if: always()
        run: python3 .github/scripts/aggregate-test-results.py

      - name: Upload JUnit XML results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-results
          path: "**/build/test-results/test/TEST-*.xml"
          if-no-files-found: warn

      - name: Upload HTML reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-html-reports
          path: "**/build/reports/tests/test/**"
          if-no-files-found: warn

      - name: Upload markdown report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-md
          path: test-report.md
          if-no-files-found: warn

      # 在 Checks 页签显示结构化测试结果
      - name: Publish test results to Checks
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: "**/build/test-results/test/TEST-*.xml"
          check_name: "Test Results"
          comment_mode: off

  server-smoke:
    name: Real server smoke (${{ matrix.label }})
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: "1.20.4 (Paper)"
            module: test-v1_20
            mc_version: "1.20.4"
            java: "21"
            expect: "[TabooLibIocTestV20] 启动"
          - label: "1.12.2 (Spigot)"
            module: test-v1_12
            mc_version: "1.12.2"
            java: "8"
            expect: "Taboolib IoC TestV12 Plugin 启动"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 构建插件 jar 用 JDK 21（全项目源码级别要求 21 才能跑 taboolib gradle 插件）
      - name: Setup build JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build plugin jar
        run: ./gradlew :${{ matrix.module }}:taboolibBuildPlugin --no-daemon

      - name: Locate plugin jar
        id: jar
        run: |
          jar=$(ls ${{ matrix.module }}/build/libs/*.jar | grep -v -E '(sources|plain)' | head -n1)
          echo "path=$(realpath "$jar")" >> "$GITHUB_OUTPUT"
          echo "[ci] plugin jar: $jar"

      # 1.12.2 必须用 Java 8 跑；1.20.4 用 Java 21。
      - name: Setup runtime JDK
        uses: actions/setup-java@v4
        id: runtime-jdk
        with:
          java-version: ${{ matrix.java }}
          distribution: "temurin"

      - name: Run server smoke
        env:
          JAVA_BIN: ${{ steps.runtime-jdk.outputs.path }}/bin/java
          LOG_DIR: ${{ runner.temp }}/smoke-logs
        run: |
          chmod +x .github/scripts/server-smoke.sh
          mkdir -p "$LOG_DIR"
          .github/scripts/server-smoke.sh \
            "${{ matrix.mc_version }}" \
            "${{ steps.jar.outputs.path }}" \
            "${{ matrix.expect }}" \
            300

      - name: Upload server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-log-${{ matrix.mc_version }}
          path: ${{ runner.temp }}/smoke-logs/*
          if-no-files-found: warn

      - name: Append smoke summary
        if: always()
        run: |
          status="${{ job.status }}"
          emoji="✅"; [ "$status" != "success" ] && emoji="❌"
          {
            echo "### $emoji 真实服务器烟雾测试 — ${{ matrix.label }}"
            echo ""
            echo "- 模块：\`${{ matrix.module }}\`"
            echo "- MC 版本：\`${{ matrix.mc_version }}\`"
            echo "- 期望日志：\`${{ matrix.expect }}\`"
            echo "- 结果：**$status**"
            echo ""
            if [ -f "${{ runner.temp }}/smoke-logs/server-${{ matrix.mc_version }}.log" ]; then
              echo "<details><summary>server.log 尾部 80 行</summary>"
              echo ""
              echo '```'
              tail -n 80 "${{ runner.temp }}/smoke-logs/server-${{ matrix.mc_version }}.log"
              echo '```'
              echo ""
              echo "</details>"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
