group=top.wcpe.taboolib.ioc
version=1.3.0
kotlin.incremental=true
kotlin.incremental.java=true
kotlin.caching.enabled=true
kotlin.parallel.tasks.in.project=true
# 本机代理环境直连名单（与 taboolib-ioc-gradle-plugin 保持一致）：
# 经本机 Gradle 代理时下列 Maven 域名直连可达，绕过代理可避免 TLS 重置 / 303 零字节等问题；
# CI 无代理时该配置为空操作。注意：直连名单语义经实测验证，不得改动。
systemProp.http.nonProxyHosts=maven.aliyun.com|maven.wcpe.top|repo.maven.apache.org|repo.tabooproject.org|repo.spongepowered.org|s01.oss.sonatype.org|oss.sonatype.org|plugins.gradle.org|plugins-artifacts.gradle.org
systemProp.https.nonProxyHosts=maven.aliyun.com|maven.wcpe.top|repo.maven.apache.org|repo.tabooproject.org|repo.spongepowered.org|s01.oss.sonatype.org|oss.sonatype.org|plugins.gradle.org|plugins-artifacts.gradle.org
